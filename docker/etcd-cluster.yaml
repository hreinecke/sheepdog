    image: gcr.io/etcd-development/etcd:v3.6.0
    hostname: ${NODE0_NAME}
    networks:
      etcd-br:
        ipv4_address: ${NODE0_IP}
    volumes:
      - etcd0-data:/var/lib/etcd
