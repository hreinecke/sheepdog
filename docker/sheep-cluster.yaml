name: sheepdog-etcd
services:
  sheep:
    image: sheepdog
    build:
      context: ../
      dockerfile: Dockerfile.sheepdog
    command: echo sheep container ready
  ioutgt-build:
    image: ioutgt-sheepdog
    build: https://github.com/hreinecke/ioutgt.git#sheepdog
  sheep0:
    image: sheepdog
    hostname: ${SHEEP0_NAME}
    mac_address: ${SHEEP0_MAC}
    init: true
    security_opt:
      - seccomp=unconfined
    networks:
      etcd-br:
        ipv4_address: ${SHEEP0_IP}
      sheep-br:
    volumes:
      - sheep0-data:${SHEEP_STORE}
    ports:
      - "127.0.0.1:7000:7000"
      - "127.0.0.1:8000:8000"
    environment:
      - SHEEP_CLUSTER_DRIVER=etcd:${NODE0_IP}
      - SHEEP_LOGGING=level=debug,dst=stdout
      - SHEEP_BASE_DIR=${SHEEP_BASE_DIR}
      - SHEEP_ADDR=${SHEEP0_IP}
      - SHEEP_VNODES=${SHEEP_VNODES}
      - SHEEP_ZONE=${SHEEP_ZONE:-0}
      - SHEEP_JOURNAL=${SHEEP_JOURNAL}
      - VALGRIND=${VALGRIND}
    command: ${VALGRIND} /usr/sbin/sheep -f
  target0:
    image: ioutgt-sheepdog
    network_mode: service:sheep0
    security_opt:
      - seccomp=unconfined
    command: /usr/sbin/ioutgt-nvme-tcp --io-threads 4 --listen 0.0.0.0:8000 --backend sheepdog:${SHEEP0_IP}:7000
  sheep1:
